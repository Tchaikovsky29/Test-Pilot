[project]
name = "test-pilot"
version = "0.1.0"
description = "AI test-case generator: explore a web app with Playwright, generate and run tests"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "playwright>=1.51",
    "pytest-playwright>=0.10.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
test-pilot = "test_pilot.cli:main"

[tool.setuptools]
packages = ["test_pilot"]

[tool.setuptools.package-dir]
test_pilot = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]